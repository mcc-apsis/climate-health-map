# Attribution decisions. Committed so that changes appear in review and outputs can be traced to them.
# The reasons for each value are in Documentation/Attribution.md.
ATTRIBUTION:
  models:
    - MIROC6
    - IPSL-CM6A-LR
    - CanESM5
    - GFDL-ESM4
    - ACCESS-ESM1-5
    - BCC-CSM2-MR
    - NorESM2-LM
  grid: g025
  scenario: ssp370
  obs_start_year: 1940
  start_year: 1951
  first_end_year: 1989
  latest_year: 2023
  min_hist_nat: 3
  n_samples: 50
  seed: 2023
  splice_baseline_start: 1995
  splice_baseline_end: 2014

# Per-study attribution scoring used by the exports (see Documentation/Attribution.md).
SCORING:
  weight: population  # weight the shares by WorldPop population per cell, or by cell area
  threshold: 0.5  # a paper counts as attributable when its share reaches this
  attr_sensitivity: true  # pass climate-sensitivity papers through the attribution-type gate
  attr_extreme_events: true  # pass extreme-event papers through it; scenario papers are always excluded
